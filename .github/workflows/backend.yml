name: Backend

# Variant B (Org-Muster): Multi-Arch-Image auf NATIVEN Runnern bauen
# (amd64 + arm64, niemals QEMU), per-arch pushen, mit imagetools mergen,
# dann den Image-Tag im Production-Overlay bumpen. Flux deployt.

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dorfentwicklungskreis-roessing/app-backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # Das ausgelieferte CSS der Verwaltung liegt gebaut im Repo (go:embed).
  # Hier wird es neu gebaut; weicht es ab, ist der Commit unvollständig.
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/internal/admin/package-lock.json
      - name: Tailwind + DaisyUI bauen
        working-directory: backend/internal/admin
        run: |
          npm ci
          npm run build:css
      - name: Kein Drift zwischen Quelle und committetem CSS
        run: |
          if ! git diff --exit-code -- backend/internal/admin/static/app.css; then
            echo "::error::static/app.css ist veraltet — 'npm run build:css' in backend/internal/admin ausführen und committen."
            exit 1
          fi

  # Voller E2E: echtes Zitadel (compose) + echtes Backend-Binary, keine Mocks.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: Zitadel + Postgres starten
        run: |
          mkdir -p e2e/machinekey && chmod 777 e2e/machinekey
          docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 180
      - name: E2E-Tests
        run: go test -tags e2e -v -count=1 ./e2e/
      - name: Compose-Logs bei Fehler
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail 100

  # Browser-E2E des Web-Admin: echter Chromium, echtes Zitadel, echter
  # Login über die Zitadel-Oberfläche. Nichts wird gemockt.
  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/e2e/web/package-lock.json
      - name: Zitadel + Postgres starten
        run: |
          mkdir -p e2e/machinekey && chmod 777 e2e/machinekey
          docker compose -f e2e/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Playwright einrichten
        working-directory: backend/e2e/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser-E2E
        working-directory: backend/e2e/web
        run: npx playwright test
      - name: Artefakte bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artefakte
          path: |
            backend/e2e/web/playwright-report/
            backend/e2e/web/test-results/
            backend/e2e/web/backend.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Compose-Logs bei Fehler
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail 200

  # 1) Pro Architektur ein natives Image bauen (nur auf main).
  build:
    if: github.event_name != 'pull_request'
    needs: [test, css, e2e, web-e2e]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  # 2) Per-arch Tags zu einem Multi-Arch-Manifest zusammenführen (kein QEMU).
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-Arch-Manifest erzeugen
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${{ github.sha }}-amd64" \
            "${IMAGE}:${{ github.sha }}-arm64"

  # 3) Image-Tag im Production-Overlay bumpen und nach main committen.
  bump:
    if: github.event_name != 'pull_request'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: imranismail/setup-kustomize@v2
      - name: Image-Tag im Production-Overlay setzen
        working-directory: deploy/overlays/production
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${{ github.sha }}"
      - name: Bump committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Kein Image-Bump nötig."
            exit 0
          fi
          git add deploy/overlays/production/kustomization.yaml
          git commit -m "ci: deploy app-backend ${{ github.sha }} [skip ci]"
          git push
