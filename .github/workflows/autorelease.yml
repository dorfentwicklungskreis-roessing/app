name: Autorelease

# Taggt jeden grünen Stand von main automatisch als neue Patch-Version.
#
# Ablauf:
#   Android/Backend laufen auf main durch  ->  dieser Workflow startet
#   -> beide Pipelines für DENSELBEN Commit grün? (die jeweils andere wird über
#      die API abgefragt; hat sie wegen der Pfadfilter gar nicht laufen müssen,
#      zählt das als „nichts einzuwenden")
#   -> scripts/naechste_version.py entscheidet über Version und Ob-überhaupt
#   -> Tag vX.Y.Z auf genau diesen Commit, Änderungsnotiz nach main
#   -> Release-Workflow wird auf dem Tag angestoßen (baut, signiert, verteilt)
#
# Keine Endlosschleife: Der Bump-Commit des Backend-Workflows trägt `[skip ci]`
# im Betreff und ändert nur deploy/ — beides sperrt ein Release (siehe
# scripts/naechste_version.py und dessen Tests).

on:
  workflow_run:
    workflows: ["Android", "Backend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      probelauf:
        description: "Nur entscheiden, nichts taggen"
        type: boolean
        default: true

# Läuft nie doppelt: sonst könnten zwei fast gleichzeitig fertige Pipelines
# denselben Tag anlegen wollen.
concurrency:
  group: autorelease
  cancel-in-progress: false

jobs:
  taggen:
    # Bei workflow_run nur weitermachen, wenn der auslösende Lauf selbst grün
    # war und zu einem Push auf main gehört.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tag und Änderungsnotiz pushen
      actions: write # Läufe abfragen und den Release-Workflow anstoßen
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PROBELAUF: ${{ github.event.inputs.probelauf || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # Tags und Historie werden für die Entscheidung gebraucht

      - name: Sind Android UND Backend für diesen Commit grün?
        id: pipelines
        run: |
          set -euo pipefail
          echo "Commit: $SHA"
          gelaufen=0
          for wf in android.yml backend.yml; do
            laeufe=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${SHA}&per_page=50" \
              --jq '[.workflow_runs[] | select(.head_branch=="main")]
                    | sort_by(.run_started_at) | reverse')
            anzahl=$(echo "$laeufe" | jq 'length')
            if [ "$anzahl" -eq 0 ]; then
              # Pfadfilter: der Workflow musste für diesen Commit nicht laufen.
              echo "$wf: kein Lauf für diesen Commit — in Ordnung"
              continue
            fi
            gelaufen=$((gelaufen + 1))
            offen=$(echo "$laeufe" | jq '[.[] | select(.status!="completed")] | length')
            if [ "$offen" -gt 0 ]; then
              echo "$wf: läuft noch — dieser Anlauf endet hier, der andere Lauf meldet sich."
              echo "weiter=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ergebnis=$(echo "$laeufe" | jq -r '.[0].conclusion')
            echo "$wf: $ergebnis"
            if [ "$ergebnis" != "success" ]; then
              echo "::notice::$wf ist für $SHA nicht grün ($ergebnis) — kein Release."
              echo "weiter=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if [ "$gelaufen" -eq 0 ]; then
            echo "::notice::Für $SHA hat keine Pipeline gebaut — kein Release."
            echo "weiter=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "weiter=true" >> "$GITHUB_OUTPUT"

      - name: Version bestimmen
        id: version
        if: steps.pipelines.outputs.weiter == 'true'
        run: python3 scripts/naechste_version.py entscheiden --bis "$SHA"

      - name: Tag anlegen und pushen
        id: tag
        if: steps.pipelines.outputs.weiter == 'true' && steps.version.outputs.release == 'true' && github.event.inputs.probelauf != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Der Tag zeigt auf genau den Commit, der grün getestet wurde.
          git tag -a "$TAG" "$SHA" -m "Automatisches Release $TAG"
          git push origin "$TAG"
          echo "getaggt=true" >> "$GITHUB_OUTPUT"

      - name: Änderungsnotiz erzeugen und nach main schreiben
        if: steps.tag.outputs.getaggt == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Der Release-Lauf erzeugt dieselbe Datei nochmals aus derselben
          # Commit-Spanne (der Tag selbst enthält sie ja nicht). Hier landet sie
          # auf main, damit store/check_metadata.py sie dauerhaft vorfindet.
          python3 scripts/aenderungsnotiz.py --version "$VERSION" --bis "$TAG" --schreiben
          git fetch origin main
          git checkout -B autorelease-notiz origin/main
          git add store/metadata/android/*/changelogs/*.txt
          if git diff --cached --quiet; then
            echo "Änderungsnotiz war schon da."
            exit 0
          fi
          git commit -m "ci: Änderungsnotiz für $TAG [skip ci]"
          for versuch in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::warning::Änderungsnotiz konnte nicht nach main gepusht werden."

      - name: Release-Workflow auf dem Tag anstoßen
        if: steps.tag.outputs.getaggt == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Ein mit GITHUB_TOKEN gepushter Tag startet keinen Workflow (Schutz
          # vor Ketten). workflow_dispatch ist davon ausgenommen — also von Hand
          # anstoßen. Falls doch schon ein Lauf existiert (z.B. weil jemand
          # später einen PAT hinterlegt), wird nichts doppelt gestartet.
          for i in 1 2 3 4 5 6; do
            vorhanden=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=20" \
              --jq "[.workflow_runs[] | select(.head_branch==\"${TAG}\")] | length")
            if [ "$vorhanden" -gt 0 ]; then
              echo "Release-Lauf für $TAG existiert bereits."
              exit 0
            fi
            sleep 5
          done
          gh workflow run release.yml --ref "$TAG"
          echo "Release-Workflow für $TAG angestoßen."

      - name: Zusammenfassung
        if: always()
        # Die Werte kommen als Umgebungsvariablen, nicht per ${{ }} in die
        # Shell-Zeile: ein Commit-Betreff im Grund darf das Skript nicht kapern.
        env:
          PIPELINES: ${{ steps.pipelines.outputs.weiter || 'false' }}
          RELEASE: ${{ steps.version.outputs.release || 'nicht geprüft' }}
          GRUND: ${{ steps.version.outputs.grund || 'Pipelines nicht (alle) grün' }}
          TAG: ${{ steps.version.outputs.tag || '—' }}
        run: |
          {
            echo "## Autorelease"
            echo ""
            echo "* Commit: \`$SHA\`"
            echo "* Pipelines grün: \`$PIPELINES\`"
            echo "* Entscheidung: \`$RELEASE\`"
            echo "* Grund: $GRUND"
            echo "* Tag: \`$TAG\`"
            echo "* Probelauf: \`$PROBELAUF\`"
          } >> "$GITHUB_STEP_SUMMARY"
