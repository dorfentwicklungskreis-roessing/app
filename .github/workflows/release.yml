name: Release

# Signierte Release-Artefakte (APK + AAB) bei Git-Tags (v*).
# Play-Store-Upload und Firebase App Distribution schalten sich automatisch
# scharf, sobald die jeweiligen Secrets im Repo hinterlegt sind:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD  → Signierung
#   PLAY_SERVICE_ACCOUNT_JSON                                    → Play Store
#   FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT_JSON               → App Distribution

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Ein Tag-Push löst diesen Workflow in der Regel selbst aus; wer zusätzlich
# von Hand auslöst, bekäme sonst zwei Läufe, die um den Asset-Upload rennen.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Nötig, um das GitHub-Release mit den Artefakten anzulegen.
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore entpacken (falls Secret vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_BASE64-Secret — Release wird debug-signiert."
          fi

      - name: Release bauen (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: release-artefakte
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: GitHub-Release mit APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Firebase App Distribution (falls Secrets vorhanden)
        working-directory: .
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase-Secrets fehlen — Verteilung übersprungen."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          curl -sL https://firebase.tools | bash
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json firebase appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups tester \
            --release-notes "Automatischer Build ${{ github.ref_name }}"

      # Vor dem Play-Upload: Store-Metadaten prüfen. Ein fehlender oder zu
      # langer Änderungshinweis soll auffallen, bevor Google das Release
      # ablehnt. Läuft auch ohne Play-Secret, kostet nichts.
      - name: Store-Metadaten prüfen
        working-directory: .
        run: python3 store/check_metadata.py

      - name: Play-Store-Upload (nur bei Tags, falls Secret vorhanden)
        # Nur getaggte Stände gehen in den Store; ein workflow_dispatch würde
        # sonst denselben versionCode ein zweites Mal hochladen und scheitern.
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON fehlt — Play-Upload übersprungen."
            exit 0
          fi
          umask 077
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-sa.json
          pip install --quiet google-api-python-client google-auth
          python .github/scripts/upload_play.py \
            --package de.roessing.app \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --credentials /tmp/play-sa.json \
            --metadata store/metadata/android \
            --track internal
          rm -f /tmp/play-sa.json
