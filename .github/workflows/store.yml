name: Store-Metadaten

# Prüft die Play-Store-Eintragung unter store/: Zeichenlimits, Vollständigkeit,
# Bildmaße und ob zum versionCode der aktuellen Version ein Änderungshinweis
# existiert. Läuft absichtlich auch bei Änderungen an build.gradle.kts — dort
# wird der versionCode aus der Version abgeleitet.
# Dazu die Tests der Release-Automatik unter scripts/.

on:
  pull_request:
    paths:
      - "store/**"
      - "scripts/**"
      - "android/app/build.gradle.kts"
      - ".github/workflows/store.yml"
  push:
    branches: [main]
    paths:
      - "store/**"
      - "scripts/**"
      - "android/app/build.gradle.kts"
      - ".github/workflows/store.yml"
  workflow_dispatch:

concurrency:
  group: store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Version, Auswahlkriterien und Änderungshinweise haben eigene Tests —
  # ohne Fremdbibliotheken, laufen in Sekunden.
  skripte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests der Release-Automatik
        run: python3 -m unittest discover -s scripts -v

  metadaten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Die aktuelle Version ist der letzte Tag — dafür braucht es die Tags.
          fetch-depth: 0
      - name: Metadaten prüfen
        run: python3 store/check_metadata.py

      # Die committeten PNGs prüft check_metadata.py bereits auf Maße, Farbtiefe
      # und Größe. Hier wird nur sichergestellt, dass sich die Grafiken aus den
      # SVG-Quellen weiterhin erzeugen lassen — ein Byte-Vergleich wäre wertlos,
      # weil verschiedene ImageMagick-Versionen minimal anders rastern.
      - name: ImageMagick installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-dejavu-core
      - name: Grafiken probeweise rendern
        run: OUT_DIR="$RUNNER_TEMP/store-bilder" bash store/assets/render.sh
