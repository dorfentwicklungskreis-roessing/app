# E2E-Umgebung: ECHTES Zitadel + Postgres — keine Mocks.
# Das Backend läuft als echtes Binary auf dem Host (siehe e2e_test.go),
# damit sein AUTH_ISSUER (http://localhost:8123) mit dem Token-Issuer
# von Zitadel übereinstimmt.
#
# Start:  docker compose up -d --wait   (dauert beim ersten Mal ~1 min)
# Tests:  cd .. && go test -tags e2e ./e2e/ -v
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.65.1
    depends_on:
      db:
        condition: service_healthy
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8123"
      ZITADEL_EXTERNALSECURE: "false"
      # Beim Init einen IAM-Admin-Machine-User anlegen und dessen
      # JSON-Key nach /machinekey schreiben — damit bootstrappen die Tests.
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /machinekey/zitadel-admin-sa.json
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: zitadel-admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: E2E Admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      # Für den Healthcheck (`zitadel ready` liest die Env, nicht die CLI-Flags):
      ZITADEL_TLS_ENABLED: "false"
    ports:
      - "8123:8080"
    volumes:
      - ./machinekey:/machinekey
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
