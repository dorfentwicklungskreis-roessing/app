apiVersion: apps/v1
kind: Deployment
metadata:
  name: dorf-app-backend
  namespace: dorf-app
  labels:
    app: dorf-app-backend
spec:
  replicas: 1
  # SQLite auf RWO-PVC: niemals zwei Pods gleichzeitig auf die Datei lassen.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dorf-app-backend
  template:
    metadata:
      labels:
        app: dorf-app-backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Image-Referenz wird von kustomize (images:) verwaltet — bare ref.
          image: ghcr.io/dorfentwicklungskreis-roessing/app-backend
          # Explizit statt Image-Entrypoint — erlaubt auch manuell importierte
          # Images ohne Entrypoint-Config (Notfall-Deploy per ctr import).
          command: ["/server"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_PATH
              value: /data/dorfapp.sqlite
            - name: AUTH_ISSUER
              value: https://id.xn--rssing-wxa.de
            # Empfängerprüfung: Auf id.xn--rssing-wxa.de liegt nicht nur die
            # Dorf-App, sondern eine Reihe weiterer Projekte. Ohne diese Liste
            # prüft das Backend nur Aussteller und Signatur — ein Token, das
            # für ein anderes Projekt derselben Rössing-ID ausgestellt wurde,
            # käme damit als gültig durch.
            #
            # Eingetragen sind die Client-IDs der Anwendungen, die dieses
            # Backend nutzen; Zitadel trägt die Client-ID der anfragenden
            # Anwendung in den aud-Claim ein. Ein Treffer genügt.
            #   385941807986376899  Android-App (AppAuth, PKCE)
            #   387943892076527811  iOS-App „Dorf-App iOS" (nativ, PKCE,
            #                       Rücksprung de.roessing.app:/oauth2redirect).
            #                       Ohne diesen Eintrag weist das Backend jedes
            #                       Token der iOS-App ab.
            #   385942875872952515  Web-Admin (= ADMIN_CLIENT_ID)
            #   385946294599876803  MCP (= MCP_CLIENT_ID, feste ID der DCR)
            #   385941791695700163  Projekt „Dorf-App" — zusätzlicher Fangnetz-
            #                       Eintrag: Tokens, die die Projekt-Audience
            #                       führen (Machine-User mit dem Scope
            #                       „…:project:id:<id>:aud"), kommen damit auch
            #                       durch. Das erweitert die Prüfung nur nach
            #                       innen: Ein fremdes Projekt trägt weder diese
            #                       Projekt-ID noch eine dieser Client-IDs.
            #
            # Wer hier eine Anwendung vergisst, sperrt deren Nutzer aus. Das
            # Backend protokolliert in dem Fall die beobachtete Audience
            # ("Token ist nicht für diese Anwendung ausgestellt (aud=…)"),
            # daran lässt sich der fehlende Wert direkt ablesen.
            - name: AUTH_AUDIENCE
              value: "385941807986376899,387943892076527811,385942875872952515,385946294599876803,385941791695700163"
            - name: ADMIN_CLIENT_ID
              value: "385942875872952515"
            # Seed legt nur bei leerer DB die Beispiel-Kästen an.
            - name: SEED
              value: "1"
            # Ideen-Eingang: Mobilfunkanbieter teilen sich eine öffentliche
            # Adresse unter vielen Kunden. Bei der Vorgabe (5/Stunde) könnten
            # nach dem Aushang mehrere Dorfbewohner abgewiesen werden, obwohl
            # sie nichts falsch gemacht haben. Ein Dorf schickt Dutzende
            # Ideen, ein Skript will Tausende — 30 trennt das sauber.
            - name: IDEEN_PRO_STUNDE
              value: "30"
            - name: IDEEN_BURST
              value: "10"
            - name: PUBLIC_URL
              value: https://app.xn--rssing-wxa.de
            # Zugangsdaten für den Versand von Benachrichtigungen über
            # Firebase Cloud Messaging. Liegt als SealedSecret im Repo und
            # wird vom Controller im Cluster entschlüsselt.
            - name: FCM_CREDENTIALS_FILE
              value: /secrets/fcm/firebase-admin.json
            # ZITADEL_SERVICE_USER_KEY_FILE (noch nicht eingerichtet):
            # Damit fragt das Backend die Träger-Mitgliedschaften (welcher
            # Verein, welche Rolle) über die Zitadel-Management-API ab. Sie
            # kommen bewusst NICHT aus dem Token — sonst bräuchte jeder neue
            # Verein ein App-Update und eine erneute Anmeldung auf jedem Gerät.
            #
            # Solange der Wert fehlt, läuft alles unverändert weiter: Es gibt
            # dann keine Träger-Rollen, die Verwaltung liegt allein beim
            # Betreiber (globale admin-Rolle), und alle sehen die öffentlichen
            # Aufgaben. Zum Einrichten:
            #
            #   1. In der Rössing-ID einen Machine-User anlegen
            #      (z.B. „dorf-app-rollen"), Access-Token-Typ JWT,
            #      JSON-Key erzeugen.
            #   2. Ihm NUR Leserechte auf Rollenzuweisungen geben
            #      (ORG_USER_GRANT_VIEWER). Er darf keine Nutzer anlegen und
            #      keine Rollen vergeben.
            #   3. Den Key als SealedSecret ablegen (wie sealed-fcm.yaml),
            #      unter /secrets/zitadel einhängen und die beiden Zeilen
            #      unten einkommentieren.
            #
            # - name: ZITADEL_SERVICE_USER_KEY_FILE
            #   value: /secrets/zitadel/service-user.json
            # ZITADEL_ROLLEN_TTL (optional, Vorgabe 45s): So lange gilt eine
            # Mitgliedschafts-Auskunft als frisch. Kurz genug, dass eine neue
            # Mitgliedschaft praktisch sofort wirkt.
            #
            # SESSION_KEY (optional): signiert die Cookies der Verwaltung.
            # Ohne ihn erzeugt der Server beim Start einen zufälligen Schlüssel
            # — Anmeldungen überleben dann kein Rollout. Für dauerhafte
            # Sitzungen ein Secret anlegen und hier per secretKeyRef einhängen.
            #
            # Sicherung: Der Server zieht täglich per VACUUM INTO eine Kopie
            # nach /data/backups (14 Stück). Bewusst kein CronJob: Das PVC ist
            # ReadWriteOnce und der Pod hält die einzige Schreibverbindung
            # (siehe README, Abschnitt „Sicherung der Datenbank").
            - name: BACKUP_DIR
              value: /data/backups
            - name: BACKUP_KEEP
              value: "14"
            - name: BACKUP_INTERVAL
              value: 24h
          volumeMounts:
            - name: data
              mountPath: /data
            - name: fcm
              mountPath: /secrets/fcm
              readOnly: true
            # Schreibbares /tmp, weil das Wurzeldateisystem nur lesbar ist.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dorf-app-data
        - name: fcm
          secret:
            secretName: dorf-app-fcm
            # Fehlt das Secret (z.B. lokal), startet der Server trotzdem —
            # dann werden schlicht keine Push-Nachrichten verschickt.
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
