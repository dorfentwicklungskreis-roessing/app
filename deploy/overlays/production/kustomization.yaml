apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- sealed-fcm.yaml
- sealed-apns.yaml

# Der konkrete Image-Tag wird von der CI via
#   kustomize edit set image ghcr.io/dorfentwicklungskreis-roessing/app-backend=...:<git-sha>
# auf den gebauten Multi-Arch-Tag gesetzt und nach main committet.
images:
- name: ghcr.io/dorfentwicklungskreis-roessing/app-backend
  newName: ghcr.io/dorfentwicklungskreis-roessing/app-backend
  newTag: fa9155d5c3defd867fdbe3451f61f66e6417a577
