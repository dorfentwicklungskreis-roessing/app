# DO NOT COMMIT WITH REAL VALUES — mit kubeseal versiegeln und die
# versiegelte Datei nach deploy/overlays/production/ legen (+ in
# kustomization.yaml eintragen).
#
# MCP-Token erzeugen:  openssl rand -base64 32 | tr -d '/+=' | head -c 48
#
# Versiegeln:
#   kubeseal --cert sealed-secrets-public-key.pem --scope namespace-wide \
#     -n dorf-app -o yaml < deploy/secrets.template.yaml \
#     > deploy/overlays/production/sealed-dorf-app-secrets.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: dorf-app-secrets
  namespace: dorf-app
type: Opaque
stringData:
  mcp-token: REPLACE_WITH_MCP_TOKEN
